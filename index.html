<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b4d3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="கார்டு டூல்">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>கார்டு விபர டூல்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--surface:#fff;--ink:#14231f;--mute:#5d6f69;--line:#d5dcd9;--accent:#0f6b57;--accent-ink:#fff;--wa:#1fa855;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--surface:#18231f;--ink:#e8f1ee;--mute:#9bb0a9;--line:#2c3b36;--accent:#3cc1a1;--accent-ink:#06211a;--wa:#2bc366;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1715;--surface:#18231f;--ink:#e8f1ee;--mute:#9bb0a9;--line:#2c3b36;--accent:#3cc1a1;--accent-ink:#06211a;--wa:#2bc366;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tab{font:inherit;font-weight:600;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.9rem}
.tab:last-child:nth-child(odd){grid-column:span 2}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
canvas{display:block;width:100%;height:auto;border-radius:12px}
.themes{display:flex;gap:10px;margin:10px 2px 0;align-items:center;font-size:.85rem;color:var(--mute)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.tab:focus-visible,.sw:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;font-weight:600}
input,textarea,select{font:inherit;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;cursor:pointer;color:var(--accent-ink);background:var(--accent)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:.8rem;font-weight:600}
.btn.del{color:var(--danger)}
.hint{font-size:.8rem;color:var(--mute);margin:6px 2px 0}
#msg{min-height:1.4em;font-size:.85rem;color:var(--accent);margin:6px 2px 10px}
h2{font-size:1rem;margin:0 0 8px}
.rec{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec b{display:block;font-weight:600}
.rec small{color:var(--mute)}
.rec .bt{display:flex;gap:6px;flex-shrink:0}
#pw{display:none}
@media print{
  body>*{display:none!important}
  body>#pw{display:block!important}
  #pw img{width:var(--pw,85.6mm);height:auto;display:block;margin:0}
  @page{margin:12mm}
}
</style>
</head>
<body>
<main>
<h1>கார்டு விபர டூல்</h1>
<div class="tabs" id="tabs"></div>

<div class="box">
  <canvas id="cv" width="1012" height="638" aria-label="கார்டு முன்னோட்டம்"></canvas>
  <div class="themes" id="themes">நிறம்</div>
</div>

<div class="box form" id="form"></div>

<div class="box">
  <div class="grid2" style="margin-bottom:10px">
    <button class="btn" id="save">சேமி</button>
    <button class="btn ghost" id="new">புதியது</button>
  </div>
  <label>WhatsApp எண்<input id="wa" inputmode="tel" placeholder="10 இலக்க எண்" autocomplete="off"></label>
  <div style="display:grid;gap:10px;margin-top:10px">
    <button class="btn" id="dl">படம் டவுன்லோடு</button>
    <button class="btn wa" id="send">WhatsApp-க்கு அனுப்பு</button>
    <div class="grid2">
      <button class="btn ghost" id="share">பகிர்</button>
      <button class="btn ghost" id="prn">பிரிண்ட்</button>
    </div>
  </div>
  <p class="hint">“WhatsApp-க்கு அனுப்பு” படத்தை டவுன்லோடு செய்து அந்த எண்ணின் சாட்டைத் திறக்கும்; 📎 மூலம் படத்தை இணைக்கவும். “பகிர்” படத்தையே நேரடியாக அனுப்பும்.</p>
  <div id="msg" role="status"></div>
</div>

<div class="box">
  <h2 id="lh">சேமித்த பதிவுகள்</h2>
  <div id="list"></div>
</div>

<div class="box">
  <details>
    <summary><b>கிளவுடு ஒத்திசைவு (Google Sheet)</b></summary>
    <div class="form" style="margin-top:10px">
      <label>Web App URL<input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>
      <label>கீ (SECRET)<input id="cfgKey" placeholder="CardCode.gs-ல் உள்ள SECRET" autocomplete="off"></label>
      <button class="btn" id="cfgSave" type="button">அமைப்பைச் சேமி</button>
      <div class="grid2">
        <button class="btn ghost" id="pull" type="button">கிளவுடில் இருந்து எடு</button>
        <button class="btn ghost" id="push" type="button">அனைத்தும் அனுப்பு</button>
      </div>
      <p class="hint">URL கொடுத்த பின் ஒவ்வொரு சேமி/அழி தானாகவே Sheet-ல் பதிவாகும்.</p>
    </div>
  </details>
</div>
</main>
<div id="pw"><img id="pimg" alt=""></div>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

var cur='bank',thm=0,editId=null,inp={},store=load();
function load(){var s;try{s=JSON.parse(localStorage.getItem('cardtool_v1'))}catch(e){}
  s=s||{};['bank','pass','visit','pay','qr'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});return s}
function persist(){try{localStorage.setItem('cardtool_v1',JSON.stringify(store))}catch(e){say('சேமிக்க முடியவில்லை.')}}
function say(s){var m=$('msg');m.textContent=s;clearTimeout(say.t);say.t=setTimeout(function(){m.textContent=''},6000)}

function data(){var d={};SV[cur].f.forEach(function(f){d[f[0]]=inp[f[0]].value.trim()});return d}
function setData(d){SV[cur].f.forEach(function(f){inp[f[0]].value=d[f[0]]||(f[3]==='sel'?f[4][0]:'')})}
function draw(){$('themes').style.display=SV[cur].noTheme?'none':'flex';SV[cur].draw(data(),THEMES[thm])}

function buildForm(){
  var fm=$('form');fm.innerHTML='';inp={};
  SV[cur].f.forEach(function(f){
    var l=document.createElement('label');l.textContent=f[1];
    var i=document.createElement(f[3]==='area'?'textarea':f[3]==='sel'?'select':'input');
    if(f[3]==='sel'){f[4].forEach(function(o){var op=document.createElement('option');op.value=op.textContent=o;i.appendChild(op)});i.addEventListener('change',draw)}
    if(f[3]==='dec')i.inputMode='decimal';
    i.placeholder=f[2]||'';i.autocomplete='off';
    if(f[3]==='num')i.inputMode='numeric';
    if(f[3]==='tel')i.inputMode='tel';
    if(f[3]==='up')i.autocapitalize='characters';
    i.addEventListener('input',draw);
    l.appendChild(i);fm.appendChild(l);inp[f[0]]=i;
  });
}
function mkBtn(txt,cls,fn){var b=document.createElement('button');b.type='button';b.className=cls;b.textContent=txt;b.onclick=fn;return b}

function renderList(){
  var L=$('list');L.innerHTML='';
  var a=store[cur];
  $('lh').textContent='சேமித்த பதிவுகள் ('+a.length+')';
  if(!a.length){var p=document.createElement('p');p.className='hint';p.textContent='இன்னும் பதிவுகள் இல்லை. விபரங்களை நிரப்பி “சேமி” அழுத்தவும்.';L.appendChild(p);return}
  a.slice().reverse().forEach(function(r){
    var row=document.createElement('div');row.className='rec';
    var tx=document.createElement('div');
    var b=document.createElement('b');b.textContent=SV[cur].title(r.d)||'—';
    var s=document.createElement('small');s.textContent=SV[cur].sub(r.d);
    tx.appendChild(b);tx.appendChild(s);
    var bt=document.createElement('div');bt.className='bt';
    bt.appendChild(mkBtn('திருத்து','btn ghost sm',function(){edit(r.id)}));
    bt.appendChild(mkBtn('பிரிண்ட்','btn ghost sm',function(){edit(r.id);setTimeout(printCard,80)}));
    bt.appendChild(mkBtn('அழி','btn ghost sm del',function(){
      if(!confirm('இந்தப் பதிவை அழிக்கவா?'))return;
      store[cur]=store[cur].filter(function(x){return x.id!==r.id});
      cloud({action:'delete',svc:cur,id:r.id});
      if(editId===r.id)newRec();
      persist();renderList();
    }));
    row.appendChild(tx);row.appendChild(bt);L.appendChild(row);
  });
}
function edit(id){
  var r=store[cur].filter(function(x){return x.id===id})[0];if(!r)return;
  editId=id;setData(r.d);thm=r.t||0;syncThemes();$('save').textContent='புதுப்பி';draw();
  window.scrollTo({top:0,behavior:'smooth'});
}
function newRec(){editId=null;setData({});$('save').textContent='சேமி';draw()}
function need(){
  var d=data(),miss=SV[cur].req.filter(function(k){return !d[k]});
  if(miss.length){say('தேவையான விபரங்களை நிரப்பவும்.');return false}return true;
}
$('save').onclick=function(){
  if(!need())return;
  var d=data();
  var rec;
  if(editId){store[cur].forEach(function(r){if(r.id===editId){r.d=d;r.t=thm;r.ts=Date.now();rec=r}});say('புதுப்பிக்கப்பட்டது.')}
  else{rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:d,t:thm,ts:Date.now()};store[cur].push(rec);say('சேமிக்கப்பட்டது.')}
  persist();renderList();newRec();
  if(rec)cloud({action:'save',svc:cur,rec:rec});
};
$('new').onclick=newRec;

function buildTabs(){
  var t=$('tabs');t.innerHTML='';
  Object.keys(SV).forEach(function(k){
    var b=mkBtn(SV[k].tab,'tab',function(){cur=k;editId=null;$('save').textContent='சேமி';buildForm();syncTabs();renderList();draw()});
    b.dataset.k=k;t.appendChild(b);
  });
  syncTabs();
}
function syncTabs(){[].forEach.call($('tabs').children,function(b){b.setAttribute('aria-pressed',b.dataset.k===cur)})}
function syncThemes(){[].forEach.call($('themes').querySelectorAll('.sw'),function(b,i){b.setAttribute('aria-pressed',i===thm)})}
THEMES.forEach(function(t,i){
  var b=document.createElement('button');b.type='button';b.className='sw';
  b.style.background='linear-gradient(135deg,'+t.a+','+t.b+')';b.setAttribute('aria-label',t.n);
  b.onclick=function(){thm=i;syncThemes();draw()};$('themes').appendChild(b);
});

function fname(){var d=data();var n=(SV[cur].title(d)||cur).replace(/[^\w\u0B80-\u0BFF]+/g,'_');return cur+'_'+n+'.png'}
function blob(){return new Promise(function(r){cv.toBlob(r,'image/png')})}
function download(){return blob().then(function(b){
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)})}
function number(){var d=$('wa').value.replace(/\D/g,'');if(d.length===10)d='91'+d;return d.length>=11?d:''}
function printCard(){
  $('pimg').src=cv.toDataURL('image/png');
  document.documentElement.style.setProperty('--pw',SV[cur].mm);
  setTimeout(function(){window.print()},60);
}
$('dl').onclick=function(){if(need())download().then(function(){say('படம் டவுன்லோடு ஆனது.')})};
$('prn').onclick=function(){if(need())printCard()};
$('send').onclick=function(){
  if(!need())return;var n=number();
  if(!n){say('சரியான WhatsApp எண்ணை உள்ளிடவும்.');return}
  var url='https://wa.me/'+n+'?text='+encodeURIComponent(SV[cur].text(data()));
  download().then(function(){say('படம் டவுன்லோடு ஆனது. சாட்டில் 📎 மூலம் இணைக்கவும்.');window.open(url,'_blank')});
};
$('share').onclick=function(){
  if(!need())return;
  blob().then(function(b){
    var f=new File([b],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:SV[cur].text(data())}).catch(function(){})}
    else download().then(function(){say('நேரடி பகிர்வு இல்லை. படம் டவுன்லோடு ஆனது.')});
  });
};

var GAS_URL='https://script.google.com/macros/s/AKfycbyq4djld7qJFmEuHBvzHhgwTJ7I8mvvhdvWrBAzS6hmvC9P8e3ng9elXFQMbUNbXsqkKQ/exec';
function cfg(){var c={};try{c=JSON.parse(localStorage.getItem('cardtool_cfg'))||{}}catch(e){}if(!c.url)c.url=GAS_URL;return c}
function cloud(body){
  var c=cfg();if(!c.url||!c.key)return Promise.resolve(null);body.key=c.key;
  return fetch(c.url,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error||'error');return j}).catch(function(e){say('கிளவுடு ஒத்திசைவு தோல்வி: '+e.message);return null});
}
var cu=$('cfgUrl'),ck=$('cfgKey'),c0=cfg();cu.value=c0.url||'';ck.value=c0.key||'';cu.value=c0.url;
$('cfgSave').onclick=function(){try{localStorage.setItem('cardtool_cfg',JSON.stringify({url:cu.value.trim(),key:ck.value.trim()}));say('அமைப்பு சேமிக்கப்பட்டது.')}catch(e){say('சேமிக்க முடியவில்லை.')}};
$('pull').onclick=function(){
  var c=cfg();if(!c.key){say('முதலில் கீ-யை சேமிக்கவும்.');return}
  fetch(c.url+'?action=list&key='+encodeURIComponent(c.key||'')).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error||'error');var n=0;
    Object.keys(store).forEach(function(k){(j.data[k]||[]).forEach(function(r){
      var m=store[k].filter(function(x){return x.id===r.id})[0];
      if(!m){store[k].push(r);n++}else if((r.ts||0)>(m.ts||0)){m.d=r.d;m.t=r.t;m.ts=r.ts;n++}
    })});
    persist();renderList();say('கிளவுடில் இருந்து '+n+' பதிவுகள் புதுப்பிக்கப்பட்டன.');
  }).catch(function(e){say('தோல்வி: '+e.message)});
};
$('push').onclick=function(){
  var items=[];Object.keys(store).forEach(function(k){store[k].forEach(function(r){items.push({svc:k,rec:r})})});
  if(!items.length){say('அனுப்ப பதிவுகள் இல்லை.');return}
  cloud({action:'bulk',items:items}).then(function(j){if(j)say(items.length+' பதிவுகள் அனுப்பப்பட்டன.')});
};
buildTabs();buildForm();syncThemes();renderList();draw();
if(document.fonts&&document.fonts.load){
  Promise.all(['400','600','700'].map(function(w){return document.fonts.load(w+' 24px "Noto Sans Tamil"')})).then(draw).catch(function(){});
}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
